[workspace]
members = [
    "crates/eggie-daemon",
    "crates/eggie-domain",
    "crates/eggie-protocol",
    "crates/eggie-ui",
]
exclude = ["vendor/alacritty", "vendor/zed-gpui"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.96"

[workspace.dependencies]
alacritty_terminal = { path = "vendor/alacritty/alacritty_terminal" }
anyhow = "1.0.100"
base64 = "0.22.1"
crossterm = "0.29"
eggie-daemon = { path = "crates/eggie-daemon" }
eggie-domain = { path = "crates/eggie-domain" }
eggie-protocol = { path = "crates/eggie-protocol" }
flate2 = "1.1.5"
gpui = { path = "vendor/zed-gpui/crates/gpui", features = ["input-latency-histogram"] }
gpui_platform = { path = "vendor/zed-gpui/crates/gpui_platform", features = ["font-kit", "runtime_shaders"] }
libc = "0.2.177"
parking_lot = "0.12.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color", "layout-cache"] }
rmp-serde = "1.3.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
sysinfo = "0.31.4"
thiserror = "2.0.17"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

# `cargo run` is the primary development workflow, and both crates contain frame-critical hot
# paths (snapshot publication, scene preparation, and Metal instance generation). Keep debug
# symbols and incremental builds while avoiding misleading performance regressions from opt-level
# 1 in the code we are actively measuring.
[profile.dev.package.eggie-daemon]
opt-level = 3

[profile.dev.package.eggie-ui]
opt-level = 3

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
